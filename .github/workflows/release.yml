name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest] # 后端打包目前仅针对 Windows 适配

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: install frontend dependencies
        run: npm install

      - name: install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          pip install pyinstaller

      - name: build backend sidecar
        run: python scripts/build_backend.py

      - name: install tauri cli
        run: npm install -g @tauri-apps/cli

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # 使用 package.json 中的版本号
          releaseName: "TOU Schedule Editor v__VERSION__"
          releaseBody: "Automated high-performance desktop build."
          releaseDraft: true
          prerelease: false
